# KrisOS conservative hardening validated on physical Fedora 44 hardware.
# Keep this intentionally small: only deltas from Fedora defaults that passed
# Plasma/Wayland, PipeWire, NetworkManager, Podman rootless, SELinux and S3
# suspend/resume testing.
kernel.kptr_restrict = 2
fs.protected_regular = 2
fs.protected_fifos = 2
fs.suid_dumpable = 0
# Low-friction network hardening: avoid redirects/source routing without
# constraining asymmetric routing, VPNs, bridges or container networking.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
