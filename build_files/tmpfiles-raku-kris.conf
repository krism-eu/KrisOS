# raku-Kris persistent state provisioning.
# Seed packages.list only when it does not already exist; never overwrite
# persistent user/M1 package intent across reboots or image updates.
d /var/lib/raku-kris 0755 root root -
C /var/lib/raku-kris/packages.list 0644 root root - /usr/share/factory/var/lib/raku-kris/packages.list
