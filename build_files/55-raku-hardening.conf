# raku-Kris conservative hardening validated on physical Fedora 44 hardware.
# Keep this intentionally small: only deltas from Fedora defaults that passed
# Plasma/Wayland, PipeWire, NetworkManager, Podman rootless, SELinux and S3
# suspend/resume testing.
kernel.kptr_restrict = 2
fs.protected_regular = 2
fs.protected_fifos = 2
fs.suid_dumpable = 0
