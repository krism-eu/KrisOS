name: Build M1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_image:
        description: "Optional explicit bootc base image for compatibility testing"
        required: false
        type: string
      publish:
        description: "Publish this validated main commit as an immutable candidate"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-m1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Fedora 44 pinned build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Validate source invariants
        shell: bash
        run: |
          set -euo pipefail
          bash -n systemd/krisos-overlay.sh
          bash -n tests/boot-check.sh
          bash -n tests/release-check.sh
          bash -n tests/run-release-vm.sh
          bash -n scripts/fetch-kriscc-component.sh
          bash -n scripts/repair-home-labels.sh
          bash -n scripts/check-initramfs-accounts.sh
          bash -n build_files/99krisos-nss/module-setup.sh
          python3 -m py_compile bin/rk tools/source_snapshot.py
          python3 tests/test_rk.py
          python3 tests/test_rk_recovery.py
          python3 tests/test_release_state.py
          python3 tests/test_release_shell.py
          python3 tests/test_overlay_recovery.py
          python3 tests/test_overlay_identity.py
          grep -Eq '^ARG BASE_IMAGE=.*@sha256:[0-9a-f]{64}$' Containerfile
          source build_files/krisCC.lock
          : "${KRISCC_SHA256:?KRISCC_SHA256 missing from lock}"
          [[ "$KRISCC_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          [[ "$KRISCC_RPM" =~ ^krisCC-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+\.fc44\.x86_64\.rpm$ ]]
          [[ "$KRISCC_SHA256" =~ ^[0-9a-f]{64}$ ]]
          grep -Fxq nano build_files/base-packages.txt
          grep -Fxq 'Hidden=true' build_files/krisCC-autostart.desktop
          grep -Fq 'COPY build_files/krisCC/krisCC.rpm /tmp/krisCC.rpm' Containerfile
          python3 - <<'PY'
          from pathlib import Path
          text = Path("Containerfile").read_text()
          kriscc = text.index("COPY build_files/krisCC/krisCC.rpm /tmp/krisCC.rpm")
          hardening = text.index("COPY build_files/55-krisos-hardening.conf")
          snapshot = text.index("# Snapshot every immutable package name owned by the final image")
          if not (hardening < kriscc < snapshot):
              raise SystemExit("krisCC must remain a late image-owned layer before ownership snapshots")
          PY
          ! grep -Fq 'github.com/krism-eu/krisCC.git' Containerfile
          ! grep -Fq 'KRISCC_COMMIT' Containerfile
          grep -Fxq 'ARG RELEASE=0.1.0-m1' Containerfile
          grep -Fq 'rpm -q krisCC' Containerfile
          grep -Fq 'grep -Fxq krisCC /usr/share/krisos/owned-packages.txt' Containerfile
          grep -Fq 'HOME=/var/home' Containerfile
          grep -Fq 'semodule -B' Containerfile
          grep -Fq 'dracut --force --no-hostonly --early-microcode --reproducible --zstd' Containerfile
          grep -Fq 'AuthenticAMD.bin' Containerfile
          grep -Fq 'COPY systemd/krisos-sync.timer /usr/lib/systemd/system/krisos-sync.timer' Containerfile
          grep -Fq 'systemctl enable krisos-sync.timer' Containerfile
          ! grep -Fq 'systemctl enable krisos-sync.service' Containerfile
          grep -Fxq '[*]' build_files/90-krisos-privacy.repo
          grep -Fxq 'countme=false' build_files/90-krisos-privacy.repo
          grep -Fxq '[UserFeedback]' build_files/KDE-UserFeedback.conf
          grep -Fxq 'Enabled=false' build_files/KDE-UserFeedback.conf
          grep -Fq "payload['requests'] = sorted(names(package_file.read_text().splitlines()))" bin/rk
          grep -Fq "re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9+_.-]{0,127}'" bin/rk
          grep -Fq 'state=/var/lib/krisos' systemd/krisos-overlay.sh
          grep -Fq 'After=ostree-remount.service' systemd/krisos-overlay.service
          grep -Fq 'Before=local-fs.target shutdown.target' systemd/krisos-overlay.service
          grep -Fq 'TimeoutStartSec=10min' systemd/krisos-overlay.service
          grep -Fq 'ExecStart=/usr/bin/rk sync' systemd/krisos-sync.service
          grep -Fq 'ConditionPathExists=/var/lib/krisos/needs-sync' systemd/krisos-sync.service
          grep -Fq 'ConditionPathExists=/run/krisos/overlay-mounted' systemd/krisos-sync.service
          grep -Fq 'TimeoutStartSec=10min' systemd/krisos-sync.service
          grep -Fq 'Restart=on-failure' systemd/krisos-sync.service
          grep -Fq 'RestartSec=30s' systemd/krisos-sync.service
          grep -Fq 'StartLimitIntervalSec=10min' systemd/krisos-sync.service
          grep -Fq 'StartLimitBurst=3' systemd/krisos-sync.service
          ! grep -Fq 'WantedBy=graphical.target' systemd/krisos-sync.service
          grep -Fq 'OnBootSec=1min' systemd/krisos-sync.timer
          grep -Fq 'OnUnitInactiveSec=10min' systemd/krisos-sync.timer
          grep -Fq 'Unit=krisos-sync.service' systemd/krisos-sync.timer
          grep -Fq 'WantedBy=timers.target' systemd/krisos-sync.timer
          grep -Fq 'excludepkgs=*.i686' build_files/dnf-krisos.conf
          grep -Fq 'multilib_policy=best' build_files/dnf-krisos.conf
          legacy_prefix='ra''ku'
          ! grep -RniE "${legacy_prefix}[-_ ]?kris|${legacy_prefix}os" --exclude-dir=.git .
          test ! -e installer
          test ! -e kickstart/krisos.ks
          test ! -e .github/workflows/build-installer.yml

      - name: Build exact source bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/source
          display_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          zip="KrisOS-${GITHUB_SHA}-source.zip"
          txt="KrisOS-${GITHUB_SHA}-source.txt"
          python3 tools/source_snapshot.py \
            --repository krism-eu/KrisOS \
            --ref "$GITHUB_SHA" \
            --display-ref "$display_ref" \
            --version '0.1.0-m1' \
            --output "artifacts/source/$txt"
          git archive --format=zip --prefix="KrisOS-${GITHUB_SHA}/" \
            --output="artifacts/source/$zip" "$GITHUB_SHA"
          grep -Fxq "# commit: $GITHUB_SHA" "artifacts/source/$txt"
          (cd artifacts/source && sha256sum "$zip" "$txt" > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Fetch verified krisCC component
        shell: bash
        run: |
          set -euo pipefail
          source build_files/krisCC.lock
          : "${KRISCC_SHA256:?KRISCC_SHA256 missing from lock}"
          bash scripts/fetch-kriscc-component.sh
          test -f build_files/krisCC/krisCC.rpm
          test -s build_files/krisCC/SHA256SUMS
          test "$(cat build_files/krisCC/RELEASE_TAG)" = "$KRISCC_TAG"
          test "$(cat build_files/krisCC/RELEASE_ASSET)" = "$KRISCC_RPM"
          test "$(cat build_files/krisCC/RELEASE_SHA256)" = "$KRISCC_SHA256"

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo
          sudo podman version

      - name: Build bootc image
        shell: bash
        env:
          BASE_IMAGE_OVERRIDE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${BASE_IMAGE_OVERRIDE:-}" ]]; then
            echo "Compatibility build with explicit base: ${BASE_IMAGE_OVERRIDE}"
            args+=(--build-arg "BASE_IMAGE=${BASE_IMAGE_OVERRIDE}")
          else
            echo "Release-path build with pinned Containerfile base"
          fi
          sudo podman build --pull=always "${args[@]}" \
            --label 'org.opencontainers.image.source=https://github.com/krism-eu/KrisOS' \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t localhost/krisos:m1 . 2>&1 | tee build.log

      - name: Inspect built image
        shell: bash
        run: |
          set -euo pipefail
          source build_files/krisCC.lock
          expected_kriscc="${KRISCC_TAG#v}.fc44.x86_64"
          test "$(sudo podman inspect localhost/krisos:m1 --format '{{ index .Config.Labels "containers.bootc" }}')" = "1"
          test "$(sudo podman inspect localhost/krisos:m1 --format '{{ index .Config.Labels "ostree.bootable" }}')" = "1"
          test "$(sudo podman inspect localhost/krisos:m1 --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "0.1.0-m1"
          test "$(sudo podman inspect localhost/krisos:m1 --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${GITHUB_SHA}"
          sudo podman run --rm -e KRISCC_EXPECTED="$expected_kriscc" --entrypoint /bin/bash localhost/krisos:m1 -lc '
            test "$(rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}" krisCC)" = "$KRISCC_EXPECTED" &&
            rpm -V krisCC &&
            rpm -q iputils plasma-milou upower p11-kit-server nano &&
            test -x /usr/libexec/krisos/repair-home-labels &&
            test -x /usr/bin/krisCC &&
            grep -Fxq "HOME=/var/home" /etc/default/useradd &&
            matchpathcon -n /var/home/kris | grep -q ":user_home_dir_t:" &&
            test -s "/usr/lib/modules/$(ls /usr/lib/modules | head -n1)/initramfs.img" &&
            systemctl is-enabled krisos-sync.timer | grep -qx enabled &&
            grep -Fxq krisCC /usr/share/krisos/owned-packages.txt &&
            grep -Fxq "countme=false" /etc/dnf/repos.override.d/90-krisos-privacy.repo &&
            grep -Fxq "Enabled=false" /etc/xdg/KDE/UserFeedback.conf &&
            grep -Fxq "Hidden=true" /etc/xdg/autostart/krisCC-background.desktop &&
            env QT_FORCE_STDERR_LOGGING=1 QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Basic KRISCC_SMOKE_TEST=1 /usr/bin/krisCC
          '

      - name: Real RPM package layer integration
        run: |
          set -euo pipefail
          sudo podman run --rm --security-opt label=disable \
            -e RK_DISPOSABLE_CONTAINER_TEST=1 \
            -v "$PWD/tests/test_rk_container.py:/tmp/test-rk.py:ro" \
            --entrypoint python3 localhost/krisos:m1 /tmp/test-rk.py \
            2>&1 | tee rk-integration.log

      - name: Install Cosign
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && inputs.base_image == ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Login to GHCR
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && inputs.base_image == ''
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.docker"
          printf '%s' "$GHCR_TOKEN" | podman login --authfile "$HOME/.docker/config.json" \
            ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Publish immutable candidate
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && inputs.base_image == ''
        shell: bash
        run: |
          set -euo pipefail
          immutable="ghcr.io/krism-eu/krisos:${GITHUB_SHA}"
          if skopeo inspect --authfile "$HOME/.docker/config.json" "docker://$immutable" >/dev/null 2>&1; then
            echo "Immutable commit tag already exists; refusing to overwrite: $immutable" >&2
            exit 1
          fi
          sudo podman tag localhost/krisos:m1 "$immutable"
          sudo podman push --authfile "$HOME/.docker/config.json" \
            --digestfile publish.digest "$immutable" 2>&1 | tee publish-immutable.log
          grep -Eq '^sha256:[0-9a-f]{64}$' publish.digest

      - name: Sign and verify immutable digest
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && inputs.base_image == ''
        run: |
          set -euo pipefail
          digest="$(cat publish.digest)"
          image="ghcr.io/krism-eu/krisos@${digest}"
          cosign sign --yes "$image"
          cosign verify \
            --certificate-identity 'https://github.com/krism-eu/KrisOS/.github/workflows/build-m1.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$image" 2>&1 | tee cosign-verify.log

      - name: Verify anonymous immutable pull
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && inputs.base_image == ''
        run: |
          set -euo pipefail
          immutable="ghcr.io/krism-eu/krisos:${GITHUB_SHA}"
          expected="$(cat publish.digest)"
          sudo podman rmi -f "$immutable" localhost/krisos:m1 || true
          authfile="$(mktemp)"
          trap 'rm -f "$authfile"' EXIT
          printf '{"auths":{}}\n' > "$authfile"
          skopeo inspect --raw --authfile "$authfile" "docker://$immutable" > anonymous-immutable-manifest.json
          actual="sha256:$(sha256sum anonymous-immutable-manifest.json | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Preserve complete logs and source identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-m1-${{ github.sha }}
          path: |
            artifacts/source/
            build.log
            rk-integration.log
            publish.digest
            publish-immutable.log
            cosign-verify.log
            anonymous-immutable-manifest.json
          if-no-files-found: ignore
