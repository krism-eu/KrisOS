name: Build K1 Final ISO Candidate

on:
  push:
    branches: [k1.0-final-restyle-fixes]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: k1-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-final-iso:
    name: Restyle + physical-QA fixes + offline ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Validate final K1 source contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/fetch-kriscc-component.sh
          bash -n installer/build-installer.sh
          bash -n tests/boot-check.sh
          bash -n tests/release-check.sh
          bash -n tests/run-release-vm.sh
          bash -n tests/k1-final-contract.sh
          bash tests/k1-final-contract.sh
          python3 -m py_compile bin/rk
          python3 tests/test_rk.py
          python3 tests/test_overlay_recovery.py
          python3 tests/test_overlay_identity.py

          grep -Eq '^ARG BASE_IMAGE=.*@sha256:[0-9a-f]{64}$' Containerfile
          grep -Fq 'FROM quay.io/fedora/fedora-bootc:45' installer/Containerfile
          grep -Fq 'anaconda-install-env-deps' installer/Containerfile
          grep -Fq 'label: "KRISOS-K1"' installer/iso.yaml
          grep -Fq 'bootc-installer' installer/build-installer.sh
          grep -Fq -- '--bootc-default-fs ext4' installer/build-installer.sh

      - name: Fetch verified krisCC restyle candidate
        shell: bash
        env:
          KRISCC_LOCK_FILE: build_files/krisCC-candidate.lock
        run: |
          set -euo pipefail
          bash scripts/fetch-kriscc-component.sh
          source build_files/krisCC-candidate.lock
          test "$(cat build_files/krisCC/RELEASE_TAG)" = "$KRISCC_TAG"
          test "$(cat build_files/krisCC/RELEASE_ASSET)" = "$KRISCC_RPM"
          test "$(cat build_files/krisCC/RELEASE_SHA256)" = "$KRISCC_SHA256"
          test "$(rpm -qp --qf '%{VERSION}-%{RELEASE}.%{ARCH}' build_files/krisCC/krisCC.rpm)" = "0.5.1-9.fc44.x86_64"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo xorriso
          sudo podman version

      - name: Verify fixed main backup payload
        shell: bash
        run: |
          set -euo pipefail
          source build_files/KrisOS-payload.lock
          authfile="$(mktemp)"
          trap 'rm -f "$authfile"' EXIT
          printf '{"auths":{}}\n' > "$authfile"
          sudo podman pull --authfile "$authfile" "$KRISOS_TARGET_REF"
          test "$(sudo podman image inspect "$KRISOS_TARGET_REF" --format '{{.Digest}}')" = "$KRISOS_DIGEST"
          test "$(sudo podman image inspect "$KRISOS_TARGET_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$KRISOS_COMMIT"
          sudo podman run --rm --entrypoint /bin/bash "$KRISOS_TARGET_REF" -lc '
            set -euo pipefail
            test "$(rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}" krisCC)" = "0.5.1-7.fc44.x86_64"
          '
          sudo podman rmi -f "$KRISOS_TARGET_REF" || true

      - name: Build final candidate bootc payload
        shell: bash
        run: |
          set -euo pipefail
          sudo podman build             --pull=always             --label 'org.opencontainers.image.source=https://github.com/krism-eu/KrisOS'             --label "org.opencontainers.image.revision=${GITHUB_SHA}"             -t localhost/krisos:k1-final             . 2>&1 | tee candidate-build.log

      - name: Inspect final candidate payload
        shell: bash
        run: |
          set -euo pipefail
          sudo podman inspect localhost/krisos:k1-final --format '{{.Id}}'
          test "$(sudo podman inspect localhost/krisos:k1-final --format '{{ index .Config.Labels "containers.bootc" }}')" = "1"
          test "$(sudo podman inspect localhost/krisos:k1-final --format '{{ index .Config.Labels "ostree.bootable" }}')" = "1"
          test "$(sudo podman inspect localhost/krisos:k1-final --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${GITHUB_SHA}"

          sudo podman run --rm --entrypoint /bin/bash localhost/krisos:k1-final -lc '
            set -euo pipefail
            test "$(rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}" krisCC)" = "0.5.1-9.fc44.x86_64"
            rpm -V krisCC
            rpm -q dnf5-plugins amd-ucode-firmware
            grep -Fxq "HOME=/var/home" /etc/default/useradd
            matchpathcon -n /var/home/kris | grep -q ":user_home_dir_t:"
            matchpathcon -n /var/home/kris/.config | grep -q ":config_home_t:"
            matchpathcon -n /var/home/kris/.local/share | grep -q ":data_home_t:"
            test -f /usr/lib/firmware/amd-ucode/microcode_amd_fam19h.bin
            count=0
            for kernel_dir in /usr/lib/modules/*; do
              test -f "$kernel_dir/modules.dep" || continue
              test -s "$kernel_dir/initramfs.img"
              lsinitrd "$kernel_dir/initramfs.img" | grep -F "kernel/x86/microcode/AuthenticAMD.bin" >/dev/null
              count=$((count + 1))
            done
            test "$count" -ge 1
            test -x /usr/bin/qdirstat
            grep -Fxq krisCC /usr/share/krisos/owned-packages.txt
            bootc container lint
            env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Basic KRISCC_SMOKE_TEST=1 /usr/bin/krisCC --background
          '

      - name: Exercise rk package layer
        shell: bash
        run: |
          set -euo pipefail
          sudo podman run --rm --security-opt label=disable             -e RK_DISPOSABLE_CONTAINER_TEST=1             -v "$PWD/tests/test_rk_container.py:/tmp/test-rk.py:ro"             --entrypoint python3 localhost/krisos:k1-final /tmp/test-rk.py             2>&1 | tee rk-integration.log

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.docker"
          printf '%s' "$GHCR_TOKEN" | podman login             --authfile "$HOME/.docker/config.json"             ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Publish immutable candidate payload
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          candidate_ref="ghcr.io/krism-eu/krisos:k1-final-${GITHUB_SHA}"
          sudo podman tag localhost/krisos:k1-final "$candidate_ref"
          sudo podman push             --authfile "$HOME/.docker/config.json"             --digestfile candidate-payload.digest             "$candidate_ref" 2>&1 | tee candidate-publish.log
          digest="$(cat candidate-payload.digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_id="$(sudo podman image inspect "$candidate_ref" --format '{{.Id}}')"
          echo "ref=$candidate_ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Sign and verify candidate payload
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.publish.outputs.ref }}
          CANDIDATE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image="${CANDIDATE_REF%@*}@${CANDIDATE_DIGEST}"
          cosign sign --yes "$image"
          cosign verify             --certificate-identity "https://github.com/krism-eu/KrisOS/.github/workflows/build-k1-final-iso.yml@refs/heads/k1.0-final-restyle-fixes"             --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'             "$image" 2>&1 | tee candidate-cosign-verify.log

      - name: Verify anonymous candidate pull
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.publish.outputs.ref }}
          CANDIDATE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          authfile="$(mktemp)"
          trap 'rm -f "$authfile"' EXIT
          printf '{"auths":{}}\n' > "$authfile"
          skopeo inspect --raw --authfile "$authfile" "docker://$CANDIDATE_REF" > anonymous-manifest.json
          test -s anonymous-manifest.json
          remote_digest="sha256:$(sha256sum anonymous-manifest.json | awk '{print $1}')"
          test "$remote_digest" = "$CANDIDATE_DIGEST"
          printf '%s\n' "$remote_digest" > anonymous-pull.digest

      - name: Build offline Anaconda ISO from candidate payload
        shell: bash
        env:
          KRISOS_PAYLOAD_REF: ${{ steps.publish.outputs.ref }}
          KRISOS_PAYLOAD_IMAGE_ID: ${{ steps.publish.outputs.image_id }}
        run: |
          set -euo pipefail
          bash installer/build-installer.sh 2>&1 | tee installer-build.log

      - name: Verify and seal ISO backup bundle
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.publish.outputs.ref }}
          CANDIDATE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          iso="$(find installer/output -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          test -s "$iso"

          (
            cd installer/output
            sha256sum --check SHA256SUMS
          )

          xorriso -indev "$iso" -pvd_info 2>&1 | tee iso-pvd.txt
          grep -Fq 'Volume id    : KRISOS-K1' iso-pvd.txt

          manifest="$(find installer/output -type f -name '*.osbuild-manifest.json' -print -quit)"
          test -n "$manifest"
          python3 - "$manifest" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          methods = []
          def walk(value):
              if isinstance(value, dict):
                  if value.get("type") == "org.osbuild.squashfs":
                      methods.append(((value.get("options") or {}).get("compression") or {}).get("method"))
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(manifest)
          if "zstd" not in methods:
              raise SystemExit(f"installer SquashFS is not zstd-compressed: {methods!r}")
          print("Verified installer SquashFS compression: zstd")
          PY

          cat > installer/output/KrisOS-candidate-payload.lock <<EOF
          KRISOS_COMMIT=${GITHUB_SHA}
          KRISOS_TARGET_REF=${CANDIDATE_REF}
          KRISOS_DIGEST=${CANDIDATE_DIGEST}
          EOF
          cp build_files/krisCC-candidate.lock installer/output/
          cp build_files/KrisOS-payload.lock installer/output/KrisOS-stable-backup.lock
          cp build_files/krisCC.lock installer/output/krisCC-stable-backup.lock
          cp docs/K1_STABLE_BACKUP.md installer/output/

          (
            cd installer/output
            find . -type f ! -name SHA256SUMS -print0               | LC_ALL=C sort -z               | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          printf 'ISO bytes: '
          stat -c '%s' "$iso"
          sha256sum "$iso" | tee final-iso.sha256
          df -h /

      - name: Upload final ISO backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krisos-k1-final-restyle-fixes-${{ github.sha }}
          path: |
            installer/output/**
            candidate-build.log
            rk-integration.log
            candidate-payload.digest
            candidate-publish.log
            candidate-cosign-verify.log
            anonymous-pull.digest
            anonymous-manifest.json
            installer-build.log
            iso-pvd.txt
            final-iso.sha256
            tests/boot-check.sh
            tests/release-check.sh
            tests/k1-final-contract.sh
            installer/README.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
