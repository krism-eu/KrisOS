name: Build KrisOS Build 68 ISO

on:
  push:
    branches:
      - installer-build68
    paths:
      - 'installer/**'
      - '.github/workflows/build-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-build68-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Fedora 45 bootc installer ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Validate pinned installer inputs
        shell: bash
        run: |
          set -euo pipefail
          bash -n installer/build-installer.sh
          grep -Fq 'FROM quay.io/fedora/fedora-bootc:45' installer/Containerfile
          grep -Fq 'anaconda-install-env-deps' installer/Containerfile
          grep -Fq 'lorax-templates-generic' installer/Containerfile
          grep -Fq 'bootc-installer' installer/build-installer.sh
          grep -Fq 'ghcr.io/krism-eu/krisos:ded161ca602b626d62214d8d78cb2ae60036bfaf' installer/build-installer.sh
          ! grep -Fq 'bootc --source-imgref=' installer/Containerfile

      - name: Install Podman
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          sudo podman version
          df -h /

      - name: Build offline installer ISO
        shell: bash
        run: |
          set -euo pipefail
          bash installer/build-installer.sh 2>&1 | tee installer-build.log

      - name: Verify generated ISO
        shell: bash
        run: |
          set -euo pipefail
          test -s installer/output/SHA256SUMS
          find installer/output -type f -name '*.iso' -print -quit | grep -q .
          (
            cd installer/output
            sha256sum --check SHA256SUMS
          )
          find installer/output -maxdepth 3 -type f -printf '%s %p\n' | sort -n
          df -h /

      - name: Upload ready ISO
        uses: actions/upload-artifact@v4
        with:
          name: krisos-build68-offline-installer
          path: |
            installer/output/**
            installer-build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
