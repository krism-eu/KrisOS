name: Build KrisOS ISO K1.0

on:
  push:
    branches: [iso-k1.0]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: iso-k1.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-iso:
    name: KrisOS K1.0 from validated main payload
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Validate pinned release inputs
        shell: bash
        run: |
          set -euo pipefail
          bash -n installer/build-installer.sh
          bash -n tests/boot-check.sh
          bash -n tests/release-check.sh
          bash -n tests/run-release-vm.sh

          source build_files/KrisOS-payload.lock
          source build_files/krisCC.lock

          test "$KRISOS_COMMIT" = "75e2584aa6681fefe6b5bc019aa64c812751a607"
          test "$KRISOS_TARGET_REF" = "ghcr.io/krism-eu/krisos:m1"
          test "$KRISOS_DIGEST" = "sha256:a13ddfd6d2d6032873cac8b1ea64fdeba6d93a9500da1c1222139314a8f9cb04"
          git merge-base --is-ancestor "$KRISOS_COMMIT" HEAD

          test "$KRISCC_TAG" = "v0.5.1-7"
          test "$KRISCC_RPM" = "krisCC-0.5.1-7.fc44.x86_64.rpm"
          test "$KRISCC_SHA256" = "ac7fe241599190c49aaf62338f41142b6025a64c3f073fc23e03a9846a17b56f"

          grep -Fq 'FROM quay.io/fedora/fedora-bootc:45' installer/Containerfile
          grep -Fq 'anaconda-install-env-deps' installer/Containerfile
          grep -Fq 'label: "KRISOS-K1"' installer/iso.yaml
          grep -Fq 'KrisOS-ISO-K1.0-x86_64' installer/build-installer.sh
          grep -Fq 'bootc-installer' installer/build-installer.sh
          grep -Fq -- '--with-manifest' installer/build-installer.sh
          grep -Fq 'ghcr.io/osbuild/image-builder@sha256:ee8729672bb2e901a9942d1e272b615cd695a58f5417c73d3d0b1b275d833fc5' installer/build-installer.sh
          ! grep -Fq 'localhost/krisos-iso-payload' installer/build-installer.sh

      - name: Install Podman
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          sudo podman version

      - name: Pull and verify exact main payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          source build_files/KrisOS-payload.lock
          payload_ref="$KRISOS_TARGET_REF"

          authfile="$(mktemp)"
          trap 'rm -f "$authfile"' EXIT
          printf '{"auths":{}}\n' > "$authfile"
          sudo podman pull --authfile "$authfile" "$payload_ref"

          actual_digest="$(sudo podman image inspect "$payload_ref" --format '{{.Digest}}')"
          test "$actual_digest" = "$KRISOS_DIGEST"
          test "$(sudo podman image inspect "$payload_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$KRISOS_COMMIT"
          test "$(sudo podman image inspect "$payload_ref" --format '{{ index .Config.Labels "containers.bootc" }}')" = "1"
          test "$(sudo podman image inspect "$payload_ref" --format '{{ index .Config.Labels "ostree.bootable" }}')" = "1"

          image_id="$(sudo podman image inspect "$payload_ref" --format '{{.Id}}')"
          printf 'Payload target ref: %s\nPayload digest: %s\nPayload ID: %s\n' "$payload_ref" "$actual_digest" "$image_id" | tee payload-inspect.txt
          echo "ref=$payload_ref" >> "$GITHUB_OUTPUT"
          echo "id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Validate KrisOS and krisCC inside payload
        shell: bash
        env:
          KRISOS_PAYLOAD_REF: ${{ steps.payload.outputs.ref }}
        run: |
          set -euo pipefail
          sudo podman run --rm --entrypoint /bin/bash "$KRISOS_PAYLOAD_REF" -lc '
            set -euo pipefail
            test "$(rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}" krisCC)" = "0.5.1-7.fc44.x86_64"
            rpm -V krisCC
            test -x /usr/bin/krisCC
            grep -Fxq krisCC /usr/share/krisos/owned-packages.txt
            owned="$(rpm -q --qf "%{NAME}\t%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}" krisCC)"
            grep -Fxq "$owned" /usr/share/krisos/owned-nevra.txt
            test -x /usr/bin/efibootmgr
            test -x /usr/bin/grubby
            test -x /usr/bin/grub2-reboot
            rpm -qf /usr/bin/efibootmgr
            rpm -qf /usr/bin/grubby
            rpm -qf /usr/bin/grub2-reboot
            systemctl is-enabled krisos-overlay.service | grep -qx enabled
            systemctl is-enabled krisos-sync.timer | grep -qx enabled
            bootc container lint
            env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Basic KRISCC_SMOKE_TEST=1 /usr/bin/krisCC --background
          '

      - name: Build offline installer ISO
        shell: bash
        env:
          KRISOS_PAYLOAD_REF: ${{ steps.payload.outputs.ref }}
          KRISOS_PAYLOAD_IMAGE_ID: ${{ steps.payload.outputs.id }}
        run: |
          set -euo pipefail
          bash installer/build-installer.sh 2>&1 | tee installer-build.log

      - name: Verify generated ISO
        shell: bash
        run: |
          set -euo pipefail
          test -s installer/output/SHA256SUMS
          iso="$(find installer/output -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          test -s "$iso"
          (
            cd installer/output
            sha256sum --check SHA256SUMS
          )

          manifest="$(find installer/output -type f -name '*.osbuild-manifest.json' -print -quit)"
          test -n "$manifest"
          python3 - "$manifest" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)

          methods = []
          def walk(value):
              if isinstance(value, dict):
                  if value.get("type") == "org.osbuild.squashfs":
                      compression = (value.get("options") or {}).get("compression") or {}
                      methods.append(compression.get("method"))
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(manifest)
          if "zstd" not in methods:
              raise SystemExit(f"installer SquashFS is not zstd-compressed: {methods!r}")
          print("Verified installer SquashFS compression: zstd")
          PY

          printf 'ISO bytes: '
          stat -c '%s' "$iso"
          find installer/output -maxdepth 3 -type f -printf '%s %p\n' | sort -n
          df -h /

      - name: Upload ISO and QA bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krisos-iso-k1.0
          path: |
            installer/output/**
            installer-build.log
            payload-inspect.txt
            build_files/KrisOS-payload.lock
            build_files/krisCC.lock
            tests/boot-check.sh
            tests/release-check.sh
            tests/run-release-vm.sh
            docs/RELEASE_VALIDATION.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
