name: Build complete KrisOS ISO

on:
  push:
    branches:
      - iso-complete-20260918
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-complete-20260918-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-iso:
    name: Validated main payload + offline installer ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Validate pinned inputs
        shell: bash
        run: |
          set -euo pipefail
          bash -n installer/build-installer.sh
          source build_files/KrisOS-payload.lock
          source build_files/krisCC.lock

          [[ "$KRISOS_PAYLOAD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$KRISOS_PAYLOAD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$KRISOS_PAYLOAD_REF" = "ghcr.io/krism-eu/krisos@$KRISOS_PAYLOAD_DIGEST"
          test "$KRISOS_PAYLOAD_COMMIT" = "ec36822bb2e74e63a7cd7e9568ed97636ca06494"

          test "$KRISCC_TAG" = "v0.5.1-6"
          test "$KRISCC_RPM" = "krisCC-0.5.1-6.fc44.x86_64.rpm"
          test "$KRISCC_SHA256" = "a8b9b0189ec2df6d4bfd5bac650135748fefddb8fc78e6cd9da80a4d925a7824"

          grep -Fq 'FROM quay.io/fedora/fedora-bootc:45' installer/Containerfile
          grep -Fq 'bootc-installer' installer/build-installer.sh
          grep -Fq 'ghcr.io/osbuild/image-builder:latest' installer/build-installer.sh
          grep -Fq -- '--with-manifest' installer/build-installer.sh
          grep -Fq 'published immutable KrisOS main payload' installer/build-installer.sh
          ! grep -Fq 'localhost/krisos-iso-payload' installer/build-installer.sh
          ! grep -Fq 'bootc --source-imgref=' installer/Containerfile

      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          sudo podman version
          df -h /

      - name: Pull and verify exact KrisOS main payload
        shell: bash
        run: |
          set -euo pipefail
          source build_files/KrisOS-payload.lock
          sudo podman pull "$KRISOS_PAYLOAD_REF" 2>&1 | tee payload-pull.log

          actual_digest="$(sudo podman image inspect "$KRISOS_PAYLOAD_REF" --format '{{.Digest}}')"
          test "$actual_digest" = "$KRISOS_PAYLOAD_DIGEST"

          actual_revision="$(sudo podman image inspect "$KRISOS_PAYLOAD_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$actual_revision" = "$KRISOS_PAYLOAD_COMMIT"

          test "$(sudo podman image inspect "$KRISOS_PAYLOAD_REF" --format '{{ index .Config.Labels "containers.bootc" }}')" = "1"
          test "$(sudo podman image inspect "$KRISOS_PAYLOAD_REF" --format '{{ index .Config.Labels "ostree.bootable" }}')" = "1"

          printf 'Validated payload: %s\nDigest: %s\nRevision: %s\n' \
            "$KRISOS_PAYLOAD_REF" "$actual_digest" "$actual_revision" | tee payload-inspect.txt

      - name: Validate krisCC inside exact payload
        shell: bash
        run: |
          set -euo pipefail
          source build_files/KrisOS-payload.lock
          source build_files/krisCC.lock
          expected="${KRISCC_RPM#krisCC-}"
          expected="${expected%.x86_64.rpm}"

          sudo podman run --rm \
            -e EXPECTED_KRISCC="$expected" \
            --entrypoint /bin/bash "$KRISOS_PAYLOAD_REF" -lc '
              set -euo pipefail
              rpm -q krisCC
              test "$(rpm -q --qf "%{VERSION}-%{RELEASE}" krisCC)" = "$EXPECTED_KRISCC"
              rpm -V krisCC
              test -x /usr/bin/krisCC
              test -f /usr/share/polkit-1/actions/org.kriscc.controlcenter.policy
              grep -Fxq krisCC /usr/share/krisos/owned-packages.txt
              owned="$(rpm -q --qf "%{NAME}\t%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}" krisCC)"
              grep -Fxq "$owned" /usr/share/krisos/owned-nevra.txt
              env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Basic KRISCC_SMOKE_TEST=1 /usr/bin/krisCC --background

              for tool in efibootmgr grubby grub2-reboot; do
                if command -v "$tool" >/dev/null 2>&1; then
                  printf "Optional boot tool available: %s -> %s\n" "$tool" "$(command -v "$tool")"
                else
                  printf "Optional boot tool not installed: %s\n" "$tool"
                fi
              done
            '

      - name: Build offline installer ISO
        shell: bash
        run: |
          set -euo pipefail
          source build_files/KrisOS-payload.lock
          export KRISOS_PAYLOAD_REF
          bash installer/build-installer.sh 2>&1 | tee installer-build.log

      - name: Verify generated ISO
        shell: bash
        run: |
          set -euo pipefail
          test -s installer/output/SHA256SUMS
          iso="$(find installer/output -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          test -s "$iso"
          (
            cd installer/output
            sha256sum --check SHA256SUMS
          )

          manifest="$(find installer/output -type f -name '*.osbuild-manifest.json' -print -quit)"
          test -n "$manifest"
          python3 - "$manifest" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)

          methods = []
          def walk(value):
              if isinstance(value, dict):
                  if value.get("type") == "org.osbuild.squashfs":
                      compression = (value.get("options") or {}).get("compression") or {}
                      methods.append(compression.get("method"))
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(manifest)
          if "zstd" not in methods:
              raise SystemExit(f"installer SquashFS is not zstd-compressed: {methods!r}")
          print("Verified installer SquashFS compression: zstd")
          PY

          printf 'ISO bytes: '
          stat -c '%s' "$iso"
          find installer/output -maxdepth 3 -type f -printf '%s %p\n' | sort -n
          df -h /

      - name: Upload complete ISO
        uses: actions/upload-artifact@v4
        with:
          name: krisos-complete-20260918
          path: |
            installer/output/**
            payload-pull.log
            payload-inspect.txt
            installer-build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
