name: Build M0

on:
  push:
    branches: [main, implement-rk]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_image:
        description: "Optional explicit bootc base image for compatibility testing"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-m0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fedora 44 pinned build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source invariants
        shell: bash
        run: |
          set -euo pipefail
          bash -n systemd/raku-kris-overlay.sh
          bash -n tests/boot-check.sh
          python3 tests/test_rk.py
          grep -Eq '^ARG BASE_IMAGE=.*@sha256:[0-9a-f]{64}$' Containerfile
          grep -Fq 'state=/var/lib/raku-kris' systemd/raku-kris-overlay.sh
          grep -Fq 'After=ostree-remount.service' systemd/raku-kris-overlay.service
          grep -Fq 'Before=local-fs.target shutdown.target' systemd/raku-kris-overlay.service
          grep -Fq 'excludepkgs=*.i686' build_files/dnf-raku-kris.conf
          grep -Fq 'multilib_policy=best' build_files/dnf-raku-kris.conf

      - name: Install Podman
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          sudo podman version

      - name: Build bootc image
        shell: bash
        env:
          BASE_IMAGE_OVERRIDE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${BASE_IMAGE_OVERRIDE:-}" ]]; then
            echo "Compatibility build with explicit base: ${BASE_IMAGE_OVERRIDE}"
            args+=(--build-arg "BASE_IMAGE=${BASE_IMAGE_OVERRIDE}")
          else
            echo "Release-path build with pinned Containerfile base"
          fi
          sudo podman build \
            --pull=always \
            "${args[@]}" \
            -t localhost/raku-kris:m0 \
            . 2>&1 | tee build.log

      - name: Inspect built image
        shell: bash
        run: |
          set -euo pipefail
          sudo podman inspect localhost/raku-kris:m0 --format '{{.Id}}'
          test "$(sudo podman inspect localhost/raku-kris:m0 --format '{{ index .Config.Labels "containers.bootc" }}')" = "1"
          test "$(sudo podman inspect localhost/raku-kris:m0 --format '{{ index .Config.Labels "ostree.bootable" }}')" = "1"

      - name: Real RPM package layer integration
        shell: bash
        run: |
          set -euo pipefail
          sudo podman run --rm --security-opt label=disable \
            -e RK_DISPOSABLE_CONTAINER_TEST=1 \
            -v "$PWD/tests/test_rk_container.py:/tmp/test-rk.py:ro" \
            --entrypoint python3 localhost/raku-kris:m0 /tmp/test-rk.py \
            2>&1 | tee rk-integration.log

      - name: Preserve complete logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-rk-logs
          path: |
            build.log
            rk-integration.log
          if-no-files-found: ignore
